<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanna Eats | อาหารเหนือสไตล์โมเดิร์น</title>
    <!-- โหลดฟอนต์ Kanit จาก Google Fonts ให้ดูทันสมัย -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E65100;
            --primary-hover: #BF360C;
            --dark: #1A1A1A;
            --light: #FDFBF7;
        }
        
        body, html {
            margin: 0; padding: 0;
            font-family: 'Kanit', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            overflow-x: hidden;
        }

        /* เมนูด้านบนแบบโปร่งใสกลืนไปกับพื้นหลัง */
        header {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        
        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .logo span { color: var(--primary); }
        
        /* สไตล์ปุ่มเมนูมือถือ (ซ่อนไว้ในจอคอม) */
        .menu-toggle { display: none; color: white; font-size: 1.8rem; cursor: pointer; user-select: none; }
        
        nav { display: flex; }
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 35px;
            font-weight: 400;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }
        
        nav a:hover, nav a.active { color: var(--primary); }
        
        /* ส่วนหน้าแรก (Hero Section) เน้นภาพพื้นหลังสวยๆ */
        .hero {
            height: 100vh;
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            /* ภาพพื้นหลังข้าวซอย */
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.4)), 
                        url('https://image.makewebeasy.net/makeweb/m_1920x0/u1XSbL97N/DefaultData/%E0%B8%82%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B8%8B%E0%B8%AD%E0%B8%A2%E0%B9%84%E0%B8%81%E0%B9%88.jpg') center/cover no-repeat;
            padding: 0 20px;
        }
        
        .hero-content {
            max-width: 850px;
            animation: fadeIn 1.5s ease-out; /* เอฟเฟกต์ค่อยๆ ปรากฏตอนโหลดเว็บ */
        }
        
        /* ชื่อร้านขนาดใหญ่ตรงกลาง */
        .main-brand {
            font-size: 6rem;
            font-weight: 700;
            color: white;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1;
            text-shadow: 2px 4px 8px rgba(0,0,0,0.5);
        }
        .main-brand span { color: var(--primary); }

        .subtitle {
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: block;
        }
        
        .hero h2 {
            font-size: 3.5rem;
            color: white;
            margin: 0 0 20px 0;
            line-height: 1.2;
            font-weight: 600;
        }
        
        .hero p {
            font-size: 1.3rem;
            color: #E0E0E0;
            font-weight: 300;
            margin-bottom: 45px;
            line-height: 1.6;
        }
        
        /* ปุ่มสไตล์โมเดิร์น */
        .btn-primary {
            background-color: var(--primary);
            color: white;
            padding: 16px 45px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(230, 81, 0, 0.4);
        }
        
        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-3px); /* เลื่อนขึ้นนิดๆ เวลานำเมาส์ไปชี้ */
            box-shadow: 0 6px 20px rgba(230, 81, 0, 0.6);
        }
        
        /* ปรับให้รองรับมือถือ (Responsive) */
        @media (max-width: 768px) {
            header { padding: 15px 20px; flex-wrap: wrap; background: rgba(0,0,0,0.8); }
            .menu-toggle { display: block; }
            nav {
                display: none; /* ซ่อนเมนูไว้ก่อน */
                flex-direction: column;
                width: 100%;
                background-color: #222;
                position: absolute;
                top: 100%;
                left: 0;
                padding: 10px 0;
                box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            }
            nav.show { display: flex; } /* แสดงเมื่อกดปุ่ม */
            nav a { margin: 10px 0; text-align: center; padding: 10px; font-size: 1.1rem; }
            
            .main-brand { font-size: 3.5rem; }
            .hero h2 { font-size: 2.2rem; }
            .hero p { font-size: 1.1rem; }
            .btn-primary { padding: 14px 35px; font-size: 1.1rem; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Lanna<span>Eats</span></a>
        <!-- ปุ่ม 3 ขีด สำหรับมือถือ -->
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
        <nav id="nav-menu">
            <a href="index.html" class="active">หน้าแรก</a>
            <a href="menu.html">เมนูอาหาร</a>
            <a href="order.html">สั่งอาหาร</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <!-- เพิ่มชื่อร้านตัวใหญ่ตรงกลาง -->
            <h1 class="main-brand">LANNA<span>EATS</span></h1>
            
            <span class="subtitle">Authentic Northern Thai Cuisine</span>
            <h2>รสชาติแห่งล้านนา<br>แท้ๆ ส่งตรงถึงคุณ</h2>
            
            <!-- Value Proposition (ข้อกำหนดอาจารย์) -->
            <p>เสิร์ฟความอร่อยของข้าวซอยต้นตำรับและอาหารเหนือแท้ๆ ส่งตรงถึงมือคุณอย่างพิถีพิถัน</p>
            
            <a href="menu.html" class="btn-primary">เปิดเมนูความอร่อย</a>
        </div>
    </section>

    <!-- Script สำหรับเมนูมือถือ -->
    <script>
        function toggleMenu() {
            document.getElementById("nav-menu").classList.toggle("show");
        }
    </script>

</body>
</html>
